name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history — a local hook can be bypassed, this cannot
      - name: install gitleaks (pinned, checksum-verified, no sudo)
        env:
          VER: 8.21.2
          # From gitleaks_8.21.2_checksums.txt on the release page. Update both together.
          SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          f="gitleaks_${VER}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/$f"
          echo "${SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: scan full history
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact

  sanitize:
    name: sensitive-content audit
    runs-on: ubuntu-latest
    env:
      AUDIT_REDACT: "1"   # logs outlive commits; never print a matched value here
    steps:
      - uses: actions/checkout@v5
      - name: negative control
        run: ./scripts/negative-control.sh
      - name: audit working tree
        run: ./scripts/audit-sanitize.sh --all

  integrity:
    name: content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: lab entry structure
        run: ./scripts/lint-labs.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -e SC2013 -e SC2016 scripts/*.sh
      - name: no images committed
        run: |
          found=$(git ls-files '*.png' '*.jpg' '*.jpeg' '*.gif' '*.webp' | grep -vxFf .audit-allow || true)
          if [ -n "$found" ]; then
            echo "images committed without allowlist entry:"; echo "$found"; exit 1
          fi
